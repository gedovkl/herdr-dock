<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><link rel="stylesheet" href="pi.css" /></head>
<body>
  <div class="row"><label for="work">Work (minutes)</label><input id="work" type="number" min="1" placeholder="25" data-setting="work" /></div>
  <div class="row"><label for="rest">Break (minutes)</label><input id="rest" type="number" min="1" placeholder="5" data-setting="rest" /></div>
  <div class="row"><label for="notify">Notify on switch</label><input id="notify" type="checkbox" checked data-setting="notify" /></div>
  <div class="hint">Press to start, press again to stop. Changing a value resets the timer.</div>
<script src="pi.js"></script>
</body>
</html>
