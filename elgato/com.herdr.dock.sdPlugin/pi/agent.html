<!doctype html>
<!-- Property Inspector for the Herdr Agent key: one setting, `agent` (1-based agent number).
     Empty = the key shows whichever agent its position gives (the default). -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    body { margin: 0; padding: 8px 12px; font: 13px ui-sans-serif, system-ui, sans-serif;
           color: #d8d8d8; background: transparent; }
    .row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    label { min-width: 96px; }
    input { width: 72px; padding: 3px 6px; color: inherit; background: #3d3d3d;
            border: 1px solid #555; border-radius: 3px; }
    .hint { color: #9a9a9a; font-size: 12px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="row">
    <label for="agent">Agent number</label>
    <input id="agent" type="number" min="1" step="1" placeholder="auto" />
  </div>
  <div class="hint">
    This key always shows agent N (in herdr-dock's order). Leave empty to fill keys by position.
  </div>
  <script>
    let socket = null;
    let context = "";
    const input = document.getElementById("agent");

    function save() {
      const value = input.value.trim();
      const settings = /^[1-9][0-9]*$/.test(value) ? { agent: Number(value) } : {};
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ event: "setSettings", context, payload: settings }));
      }
    }

    // Called by the app (Elgato Stream Deck, OpenDeck) when the inspector opens.
    function connectElgatoStreamDeckSocket(port, uuid, registerEvent, _info, actionInfo) {
      context = uuid;
      try {
        const settings = JSON.parse(actionInfo).payload.settings || {};
        if (settings.agent) input.value = settings.agent;
      } catch (_) { /* no settings yet */ }
      socket = new WebSocket("ws://127.0.0.1:" + port);
      socket.onopen = () => socket.send(JSON.stringify({ event: registerEvent, uuid }));
    }
    window.connectElgatoStreamDeckSocket = connectElgatoStreamDeckSocket;

    input.addEventListener("change", save);
    input.addEventListener("input", save);
  </script>
</body>
</html>
