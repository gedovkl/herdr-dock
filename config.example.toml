# herdr-dock config: copy to ~/.config/herdr-dock/config.toml
# Every setting is optional; the values shown are the defaults unless marked "example".

# herdr socket; empty = auto-detect ($HERDR_SOCKET, `herdr status server`, ~/.config/herdr/herdr.sock)
herdr_socket = ""

# Text under the status symbol: "cwd" (folder name), "title" (terminal title) or "name" (agent name)
label = "cwd"

# Full agent refresh even without events (seconds)
resync_seconds = 30

# Animation: blocked blinks, working spins, statuses in `attention` blink/pulse
animate = true
blink_hz = 2
spinner_fps = 4
pulse_hz = 0.7
attention = ["blocked"]        # add "done" to pulse unseen finished work

# Status colours (#rrggbb)
[colors]
# blocked = "#e64553"
# done = "#179299"
# working = "#df8e1d"
# idle = "#40a02b"
# unknown = "#7c7f93"

# After focusing an agent in herdr, bring its terminal window to the front.
[raise]
enabled = true
# Linux: "herdr-window" (or empty) focuses the window the herdr client runs in, via Hyprland.
# Any other value is a shell command; {pane_id} {workspace_id} {tab_id} {cwd} {kind} are filled
# in (shell-quoted). Write literal braces as {{ and }}, e.g. for Hyprland's Lua dispatcher:
#   linux = "hyprctl dispatch 'hl.dsp.focus({{ window = \"class:foot\" }})'"
linux = "herdr-window"
# macOS (milestone 5), example:
# macos = "osascript -e 'tell application \"Ghostty\" to activate'"

[linux]
brightness = 70
device_ids = ["5548:1000", "6603:1009", "6603:1012"]   # VID:PID, tried in order
app_launcher = "uwsm-app -- {app}"                     # used by `app = ...` home keys
poll_seconds = 2                                       # how often to look for the M18
focus_herdr_on_enter = true                            # Herdr button also raises the herdr window
blank_when_locked = true      # dock off while the session is locked (Hyprland session lock)
blank_on_sleep = true         # dock off when the machine suspends (logind PrepareForSleep)
lock_poll_seconds = 1         # how often to check the lock state

# The three buttons under the screen: "herdr" (enter/leave Herdr mode), "page" (next agent page)
# or "none"
[linux.buttons]
left = "herdr"
middle = "none"
right = "page"

# Home page. key = 1..15, left to right, top to bottom. Each key does exactly one thing:
#   herdr = true       enter Herdr mode
#   app = "<id>"       launch through app_launcher: a command on PATH, or a desktop entry ID
#                      including ".desktop" (e.g. "sublime_merge.desktop")
#   run = "<command>"  run a shell command (detached)
# Optional:
#   focus = "<regex>"  if a Hyprland window whose class matches exists, focus it instead of
#                      launching (`hyprctl clients` shows classes; anchor with ^...$)
#   symbol = "<glyph>" or icon = "<path to image>" (icon wins)
[[home]]
key = 1
label = "herdr"
symbol = "◐"
herdr = true

# Focus the running app, or launch it if it isn't running. Icon paths are from Arch packages;
# adjust them, and the window classes (`hyprctl clients -j | jq -r '.[].class'`), for your system.
[[home]]
key = 2
label = "Browser"
icon = "/usr/share/icons/hicolor/128x128/apps/chromium.png"
app = "chromium"
focus = "^chromium$"

[[home]]
key = 3
label = "Merge"
icon = "/usr/share/icons/hicolor/128x128/apps/sublime-merge.png"
app = "sublime_merge.desktop"     # desktop entry ID: the binary isn't on PATH
focus = "^sublime_merge$"

[[home]]
key = 4
label = "Zed"
icon = "/usr/share/icons/hicolor/512x512/apps/zed.png"
app = "dev.zed.Zed.desktop"
focus = "^dev\\.zed\\.Zed$"

[[home]]
key = 11
widget = "clock"
time_format = "%H:%M"          # strftime; e.g. "%I:%M %p" for 12-hour
date_format = "%a\n%-d %b"      # \n = new row (day, then date); "" hides the date

[[home]]
key = 12
widget = "weather"             # current conditions from Open-Meteo (no API key)
place = "Nashua"
latitude = 42.7654
longitude = -71.4676
units = "celsius"              # or "fahrenheit"
refresh_minutes = 15

# [[home]]                       # example: a shell command
# key = 5
# label = "Lock"
# symbol = "⏻"
# run = "omarchy-lock-screen"
