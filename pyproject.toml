[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "herdr-dock"
version = "0.1.0"
description = "Show herdr coding agents as live keys on a StreamDock M18"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pillow>=10"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]
linux = ["pyudev>=0.24"]
macos = ["websocket-client>=1.8", "pyinstaller>=6.12"]

[tool.setuptools.packages.find]
include = ["herdr_core*", "linux*", "macos*"]

[tool.setuptools.package-data]
herdr_core = ["fonts/*.ttf", "fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "hardware: needs a StreamDock M18 plugged in (opt-in)",
    "herdr_live: needs a running herdr server (opt-in)",
]
addopts = "-m 'not hardware and not herdr_live' --strict-markers"

[tool.coverage.run]
branch = true
source = ["herdr_core", "linux", "macos"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# herdr's "blocked" glyph is the multiplication sign.
allowed-confusables = ["×"]

[tool.mypy]
python_version = "3.11"
packages = ["herdr_core", "linux"]
strict = true

[[tool.mypy.overrides]]
module = ["StreamDock.*"]
ignore_missing_imports = true
